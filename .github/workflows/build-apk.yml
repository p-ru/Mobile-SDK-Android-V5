name: Generate Android APK

# Trigger the workflow when code is pushed to the 'new' branch
on:
  push:
    branches:[ "new" ]
  pull_request:
    branches: [ "new" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Java (Requires knowing your JDK version)
    - name: Set up JDK 17 
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Make the Gradle wrapper executable
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Build the Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Upload the generated APK so you can download it from GitHub
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
